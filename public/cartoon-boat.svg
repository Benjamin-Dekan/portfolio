<svg width="480" height="420" viewBox="0 0 480 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hullFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2a03d"/>
      <stop offset="100%" stop-color="#e08423"/>
    </linearGradient>
    <linearGradient id="sailFill" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f1e8"/>
    </linearGradient>
    <linearGradient id="anchorFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7d8891"/>
      <stop offset="100%" stop-color="#4a525a"/>
    </linearGradient>
  </defs>

  <g id="boat-group" stroke="#1e293b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">

    <!-- mast -->
    <line x1="240" y1="40" x2="240" y2="255" stroke="#3d2b1a" stroke-width="7"/>

    <!-- flag -->
    <path d="M 240 44 L 272 54 L 240 64 Z" fill="#e2483c" stroke-width="3"/>

    <!-- main sail (triangle, cartoon-simple) -->
    <path d="M 244 55 L 244 250 L 330 210 Z" fill="url(#sailFill)"/>

    <!-- jib sail -->
    <path d="M 236 90 L 236 245 L 165 220 Z" fill="url(#sailFill)"/>

    <!-- boom -->
    <line x1="240" y1="248" x2="320" y2="228" stroke="#3d2b1a" stroke-width="6"/>

    <!-- hull -->
    <path d="M 70 265
             L 410 265
             L 375 330
             Q 240 365, 105 330
             Z"
          fill="url(#hullFill)"/>

    <!-- hull rim -->
    <rect x="72" y="255" width="336" height="20" rx="10" fill="#2e4f6b" stroke="#1e293b" stroke-width="4"/>

    <!-- hull stripe detail -->
    <path d="M 100 300 L 380 300" stroke="#c96b12" stroke-width="6" fill="none" stroke-linecap="round"/>

    <!-- small cabin -->
    <rect x="200" y="230" width="55" height="28" rx="6" fill="#8a5a30" stroke="#1e293b" stroke-width="4"/>
    <rect x="211" y="237" width="14" height="12" rx="2" fill="#bcdff0" stroke="#1e293b" stroke-width="2"/>

    <!-- === ANCHOR + ROPE (separate group, animate independently) === -->
    <g id="anchor-group" stroke-width="4">
      <line id="anchor-rope" x1="130" y1="266" x2="130" y2="300" stroke="#8a6a3f" stroke-width="4"/>
      <g id="anchor-icon" transform="translate(130, 300)">
        <circle cx="0" cy="-5" r="7" fill="none" stroke="url(#anchorFill)"/>
        <line x1="0" y1="2" x2="0" y2="34" stroke="url(#anchorFill)" stroke-width="6"/>
        <line x1="-16" y1="12" x2="16" y2="12" stroke="url(#anchorFill)" stroke-width="6"/>
        <path d="M 0 34 C -16 34 -22 22 -19 10" fill="none" stroke="url(#anchorFill)" stroke-width="6"/>
        <path d="M 0 34 C 16 34 22 22 19 10" fill="none" stroke="url(#anchorFill)" stroke-width="6"/>
      </g>
    </g>
  </g>
</svg>
